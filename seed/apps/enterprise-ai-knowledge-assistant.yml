app:
  description: 企业 AI 知识助手：基于内部知识库（产品说明书/技术文档/IT运维SOP/售后流程/FAQ）回答员工问题，支持引用来源与自动转人工。
  icon: "\U0001F4DA"
  icon_background: '#E1EEFF'
  mode: advanced-chat
  name: Enterprise AI Knowledge Assistant
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload: {}
    opening_statement: 您好，我是云帆科技企业知识助手。可以为您解答产品功能、技术集成、IT 运维、售后流程与常见问题。请直接描述您的问题，例如「VPN 连不上怎么办？」或「YF-Suite 如何与 AD 集成？」。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - YF-Suite 支持哪些浏览器？
    - 电脑蓝屏了怎么处理？
    - VPN 连接超时怎么办？
    - 网关固件升级失败如何处理？
    - 售后维修的时效是多久？
    - 如何申请 VPN 账号？
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-knowledge_retrieval
      source: start
      sourceHandle: source
      target: knowledge_retrieval
      targetHandle: target
      type: custom
    - id: knowledge_retrieval-route
      source: knowledge_retrieval
      sourceHandle: source
      target: route
      targetHandle: target
      type: custom
    - id: route-true-llm_answer
      source: route
      sourceHandle: 'true'
      target: llm_answer
      targetHandle: target
      type: custom
    - id: route-false-llm_fallback
      source: route
      sourceHandle: 'false'
      target: llm_fallback
      targetHandle: target
      type: custom
    - id: llm_answer-answer
      source: llm_answer
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
    - id: llm_fallback-answer_fallback
      source: llm_fallback
      sourceHandle: source
      target: answer_fallback
      targetHandle: target
      type: custom
    nodes:
    - data:
        desc: ''
        title: 开始
        type: start
        variables: []
      id: start
      position:
        x: 80
        y: 260
      positionAbsolute:
        x: 80
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        dataset_ids:
        - 10000000-0000-0000-0000-000000000001
        - 10000000-0000-0000-0000-000000000002
        - 10000000-0000-0000-0000-000000000003
        - 10000000-0000-0000-0000-000000000004
        - 10000000-0000-0000-0000-000000000005
        desc: 从企业知识库（产品/技术/IT运维/售后/FAQ）多路检索，启用分数阈值与重排，控制检索质量。
        metadata_filtering_mode: disabled
        multiple_retrieval_config:
          reranking_enable: true
          reranking_mode: reranking_model
          reranking_model:
            model: ''
            provider: ''
          score_threshold: 0.5
          top_k: 5
          weights: null
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        title: 企业知识库检索
        type: knowledge-retrieval
        variables: []
        vision:
          enabled: false
      height: 156
      id: knowledge_retrieval
      position:
        x: 360
        y: 240
      positionAbsolute:
        x: 360
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          logical_operator: and
          conditions:
          - variable_selector:
            - knowledge_retrieval
            - result
            comparison_operator: not empty
        desc: 判断检索结果是否命中知识库：命中走「基于知识库回答」，未命中走「兜底与转人工」。
        title: 检索结果判断
        type: if-else
        variables: []
      height: 126
      id: route
      position:
        x: 640
        y: 260
      positionAbsolute:
        x: 640
        y: 260
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - knowledge_retrieval
          - result
        desc: 命中知识库：依据检索片段回答，强制引用来源，禁止编造。
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - role: system
          text: "你是「云帆科技企业知识助手」，面向企业内部员工提供产品、技术、IT 运维、售后与 FAQ 咨询。\n\n必须遵守以下规则：\n1. 只能依据【上下文】中提供的知识库内容回答，禁止使用上下文之外的知识或经验猜测。\n2. 如果【上下文】中没有足够依据回答用户问题，必须直接、明确地回复「知识库中暂未找到相关信息，建议联系 IT 服务台（4008 转 100）或提交工单」，禁止编造答案。\n3. 回答必须引用来源：在答案末尾单独一行标注「引用：[对应文档名称]」；若涉及 SOP，需按步骤逐步输出操作流程。\n4. 用户问题与【上下文】不相关时，礼貌提示用户更换问法，并给出可咨询的示例问题。\n5. 回答使用简体中文，简洁、结构化；不确定的信息不要猜测。"
        - role: user
          text: '{{#sys.query#}}'
        selected: true
        title: 基于知识库回答
        type: llm
        variables: []
        vision:
          enabled: false
      height: 260
      id: llm_answer
      position:
        x: 920
        y: 160
      positionAbsolute:
        x: 920
        y: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: 未命中知识库：兜底应答并引导转人工。
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: ''
          provider: ''
        prompt_template:
        - role: system
          text: "你是「云帆科技企业知识助手」的兜底应答机器人。\n规则：\n1. 知识库检索未找到与用户问题相关的资料。\n2. 请礼貌告知用户：「抱歉，企业知识库中暂未检索到与您问题相关的资料。为避免给出不准确的信息，建议您联系 IT 服务台（4008 转 100）或提交服务工单，由人工为您处理。」\n3. 同时为用户提供 1-2 条可尝试的示例问法（例如更明确的关键词），帮助用户重新提问。\n4. 不要编造任何技术方案或数据。"
        - role: user
          text: '{{#sys.query#}}'
        selected: true
        title: 兜底应答
        type: llm
        variables: []
        vision:
          enabled: false
      height: 200
      id: llm_fallback
      position:
        x: 920
        y: 420
      positionAbsolute:
        x: 920
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm_answer.text#}}'
        desc: ''
        title: 回答
        type: answer
        variables: []
      height: 90
      id: answer
      position:
        x: 1200
        y: 160
      positionAbsolute:
        x: 1200
        y: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#llm_fallback.text#}}'
        desc: ''
        title: 兜底回答
        type: answer
        variables: []
      height: 90
      id: answer_fallback
      position:
        x: 1200
        y: 420
      positionAbsolute:
        x: 1200
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
